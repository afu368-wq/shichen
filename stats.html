<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问统计 - 职场时位</title>
    <style>
        :root {
            --primary: #C48793;
            --primary-light: #D9A7B0;
            --primary-dark: #A06B7A;
            --accent: #E8D0D5;
            --accent-light: #F5E8EB;
            --background: #FFF5F3;
            --card: #FFFFFF;
            --text-primary: #4A3535;
            --text-secondary: #8B6F6F;
            --text-light: #B8A0A0;
            --shadow: 0 4px 24px rgba(180, 140, 150, 0.10);
            --radius: 20px;
            --radius-sm: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(180deg, var(--background) 0%, #FFF0EE 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 24px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            text-align: center;
            padding: 30px 0 20px;
            border-bottom: 2px solid var(--accent);
            margin-bottom: 32px;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -6px; left: 50%;
            transform: translateX(-50%);
            width: 48px; height: 4px;
            background: var(--primary-light);
            border-radius: 2px;
        }
        .header h1 { font-size: 1.6rem; color: var(--primary-dark); margin-bottom: 8px; }
        .header p { color: var(--text-secondary); font-size: 0.9rem; }
        .header .nav-link { display: inline-block; margin-top: 12px; color: var(--primary); text-decoration: none; font-size: 0.85rem; }
        .header .nav-link:hover { text-decoration: underline; }
        .tabs {
            display: flex; gap: 8px; margin-bottom: 24px;
        }
        .tab {
            padding: 10px 24px; border-radius: var(--radius-sm);
            background: var(--background); border: 2px solid transparent;
            cursor: pointer; font-size: 0.9rem; font-weight: 500;
            color: var(--text-secondary); transition: all 0.2s;
        }
        .tab:hover { border-color: var(--accent); background: #fff; }
        .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px; margin-bottom: 24px;
        }
        .stat-card {
            background: var(--card); border-radius: var(--radius);
            padding: 24px; box-shadow: var(--shadow);
            border: 1px solid var(--accent-light); text-align: center;
        }
        .stat-value {
            font-size: 2.2rem; font-weight: 700; color: var(--primary-dark);
        }
        .stat-label {
            font-size: 0.85rem; color: var(--text-secondary); margin-top: 6px;
        }
        .card {
            background: var(--card); border-radius: var(--radius);
            padding: 28px; box-shadow: var(--shadow);
            border: 1px solid var(--accent-light); margin-bottom: 20px;
        }
        .card h2 {
            font-size: 1.15rem; color: var(--primary-dark); margin-bottom: 18px;
            font-weight: 600;
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 12px 16px; color: var(--text-secondary); font-weight: 500; border-bottom: 2px solid var(--accent); }
        td { padding: 12px 16px; border-bottom: 1px solid var(--accent-light); color: var(--text-primary); }
        tr:hover td { background: var(--accent-light); }
        .bar-wrap { display: flex; align-items: center; gap: 12px; }
        .bar-fill {
            height: 24px; border-radius: 6px; background: linear-gradient(90deg, var(--primary), var(--primary-light));
            min-width: 4px; transition: width 0.6s ease;
        }
        .bar-num { font-size: 0.85rem; color: var(--text-secondary); white-space: nowrap; }
        .badge {
            display: inline-block; padding: 4px 12px; border-radius: 12px;
            font-size: 0.75rem; font-weight: 600;
            background: var(--accent-light); color: var(--primary-dark);
        }
        .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
        @media (max-width: 600px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            th, td { padding: 10px 8px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>访问统计</h1>
            <p>职场时位网站访问数据概览</p>
            <a href="/index.html" class="nav-link">← 返回首页</a>
        </div>

        <div class="tabs">
            <div class="tab active" data-days="1">今天</div>
            <div class="tab" data-days="7">近7天</div>
            <div class="tab" data-days="30">近30天</div>
            <div class="tab" data-days="90">近3个月</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="stat-total">--</div>
                <div class="stat-label">总访问次数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-avg">--</div>
                <div class="stat-label">平均停留（秒）</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-countries">--</div>
                <div class="stat-label">覆盖国家/地区</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-cities">--</div>
                <div class="stat-label">覆盖城市</div>
            </div>
        </div>

        <div class="card">
            <h2>按国家/地区分布</h2>
            <div id="country-chart"></div>
        </div>

        <div class="card">
            <h2>按城市分布 Top 20</h2>
            <div id="city-chart"></div>
        </div>

        <div class="card">
            <h2>最近访问记录</h2>
            <div id="recent-table"></div>
        </div>
    </div>

    <script>
        var currentDays = 1;

        function loadStats(days) {
            currentDays = days;
            var container = document.querySelector('.container');
            container.style.opacity = '0.6';

            fetch('/api/visit/stats?days=' + days)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    container.style.opacity = '1';
                    renderStats(data);
                })
                .catch(function() {
                    container.style.opacity = '1';
                    document.getElementById('stat-total').textContent = '错误';
                });
        }

        function renderStats(data) {
            document.getElementById('stat-total').textContent = data.total;
            document.getElementById('stat-avg').textContent = data.avgDuration;
            document.getElementById('stat-countries').textContent = data.byCountry.length;
            document.getElementById('stat-cities').textContent = data.byCity.length;

            // 国家分布
            var maxCount = data.byCountry.length > 0 ? data.byCountry[0].count : 1;
            var countryHtml = '';
            data.byCountry.forEach(function(item) {
                var pct = Math.round(item.count / maxCount * 100);
                countryHtml += '<div style="margin-bottom:10px;">' +
                    '<div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:0.85rem;">' +
                    '<span>' + (item.country || '未知') + '</span>' +
                    '<span class="bar-num">' + item.count + ' 次</span></div>' +
                    '<div class="bar-wrap"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
                    '</div>';
            });
            document.getElementById('country-chart').innerHTML = countryHtml || '<p style="color:var(--text-light);">暂无数据</p>';

            // 城市分布
            var maxCity = data.byCity.length > 0 ? data.byCity[0].count : 1;
            var cityHtml = '';
            data.byCity.forEach(function(item) {
                var pct = Math.round(item.count / maxCity * 100);
                cityHtml += '<div style="margin-bottom:10px;">' +
                    '<div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:0.85rem;">' +
                    '<span>' + (item.city || '未知') + (item.country ? ' (' + item.country + ')' : '') + '</span>' +
                    '<span class="bar-num">' + item.count + ' 次</span></div>' +
                    '<div class="bar-wrap"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
                    '</div>';
            });
            document.getElementById('city-chart').innerHTML = cityHtml || '<p style="color:var(--text-light);">暂无数据</p>';

            // 最近记录
            var tableHtml = '<table><thead><tr><th>时间</th><th>IP</th><th>国家</th><th>城市</th><th>停留</th></tr></thead><tbody>';
            data.recent.forEach(function(row) {
                var dur = row.duration_sec > 0 ? row.duration_sec + 's' : '--';
                tableHtml += '<tr>' +
                    '<td>' + (row.created_at || '') + '</td>' +
                    '<td style="font-size:0.8rem;color:var(--text-light);">' + (row.ip || '--') + '</td>' +
                    '<td>' + (row.country || '--') + '</td>' +
                    '<td>' + (row.city || '--') + '</td>' +
                    '<td>' + dur + '</td></tr>';
            });
            tableHtml += '</tbody></table>';
            document.getElementById('recent-table').innerHTML = tableHtml || '<p style="color:var(--text-light);">暂无记录</p>';
        }

        // Tab 切换
        document.querySelectorAll('.tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
                tab.classList.add('active');
                loadStats(parseInt(tab.dataset.days));
            });
        });

        // 初始加载
        loadStats(1);
    </script>
</body>
</html>
